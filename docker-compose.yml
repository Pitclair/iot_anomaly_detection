version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: ${APP_IMAGE_NAME}
    container_name: ${APP_CONTAINER_NAME:-iot_anomaly_app}
    working_dir: /srv/app
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/srv/app
      - ./data:/data
      - ./configs:/configs:ro
    command: >
      sh -c "python -m pip install --no-deps -e . && lm-idnet train --config configs/config.json"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import lm_idnet.processing.aggregation' || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
