[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-idnet"
version = "0.1.0"
description = "Adaptive IoT anomaly detection using Dirichlet--Multinomial models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mpmath>=1.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2,<3",
  "scapy>=2.5",
  "scipy>=1.11",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
lm-idnet = "lm_idnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lm_idnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
