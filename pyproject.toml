[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-idnet"
version = "0.1.0"
description = "Adaptive IoT anomaly detection using Dirichlet--Multinomial models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mpmath==1.4.1",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pydantic==2.13.4",
  "scapy==2.7.0",
  "scipy==1.17.1",
  "tabulate==0.10.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
lm-idnet = "lm_idnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lm_idnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "-m",
  "not slow and not pcap and not benchmark",
]
markers = [
  "unit: isolated, deterministic tests without external processes or datasets",
  "integration: tests spanning multiple modules or a subprocess boundary",
  "numerical: numerical correctness, stability, or convergence tests",
  "slow: tests too expensive for the default fast suite",
  "pcap: tests requiring packet-capture fixtures or parsing",
  "benchmark: non-correctness performance measurements",
]
